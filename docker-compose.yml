# ============================================
# Sofía Comercial AI — Docker Compose
# ============================================
# Producción: docker compose --env-file .env up -d
# Desarrollo: docker compose --env-file .env.dev up
# ============================================

services:
  sofia-bot:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: sofia-comercial-bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      # Persistencia de base de datos
      - ./data:/app/data
      # Logs
      - ./logs:/app/logs
    ports:
      # Panel web (opcional, solo si se expone)
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
