# ============================================
# Render — Sofía Comercial AI
# ============================================
# Render Blueprint — deploy automático desde GitHub
# ============================================

services:
  # Servicio principal: FastAPI + Telegram Bot
  - type: web
    name: sofia-comercial
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    preDeployCommand: python -m app.database.migrations && python -m app.services.price_importer servired_knowledge/precios/PRECIOS\ MAYO\ 2026\ \(1\).xls && python -m app.services.aportes_importer servired_knowledge/aportes/aportes_monotributo.xlsx && python -m app.services servired_knowledge
    startCommand: uvicorn app.server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      # Telegram
      - key: TELEGRAM_BOT_TOKEN
        sync: false  # Configurar manualmente en Dashboard
      # Groq
      - key: GROQ_API_KEY
        sync: false
      - key: AI_MODEL
        value: llama-3.3-70b-versatile
      # Database (se vincula con el servicio de PostgreSQL)
      - key: DATABASE_URL
        fromDatabase:
          name: sofia-db
          property: connectionString
      # Entorno
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: LOG_LEVEL
        value: INFO
      # Grupos de Telegram (ganchos + escucha). Configurar en Dashboard.
      - key: TELEGRAM_GROUP_CHAT_IDS
        sync: false
      - key: TELEGRAM_GROUP_HOOKS
        value: true
      - key: TELEGRAM_GROUP_HOOK_HORARIOS
        value: "08:30,13:00,18:30,21:30"

  # Base de datos PostgreSQL
  - type: pgsql
    name: sofia-db
    plan: free
    databaseName: sofia_comercial
