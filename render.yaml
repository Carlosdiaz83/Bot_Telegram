# ============================================
# Render — Sofía Comercial AI
# ============================================
# Render Blueprint — deploy automático desde GitHub
# ============================================

services:
  # Servicio principal: FastAPI + Telegram Bot
  - type: web
    name: sofia-comercial
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      # Telegram
      - key: TELEGRAM_BOT_TOKEN
        sync: false  # Configurar manualmente en Dashboard
      # Groq
      - key: GROQ_API_KEY
        sync: false
      - key: AI_MODEL
        value: llama-3.3-70b-versatile
      # Database (se vincula con el servicio de PostgreSQL)
      - key: DATABASE_URL
        fromDatabase:
          name: sofia-db
          property: connectionString
      # Entorno
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: LOG_LEVEL
        value: INFO

  # Base de datos PostgreSQL
  - type: pgsql
    name: sofia-db
    plan: free
    databaseName: sofia_comercial
